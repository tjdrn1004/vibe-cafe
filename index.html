<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>바이브 카페 - 주문서</title>
  <!-- 스타일 시트 연결 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===== 페이지 상단: 카페 로고, 이름, 부제 ===== -->
  <header class="cafe-header">
    <div class="cafe-logo">☕</div>
    <h1 class="cafe-name">바이브 카페</h1>
    <p class="cafe-subtitle">당신의 하루에 바이브를 더하다</p>
  </header>

  <!-- ===== 탭 메뉴: 주문하기 / 주문 내역 ===== -->
  <!-- active 클래스가 붙은 탭이 지금 선택된 탭 -->
  <nav class="tabs" role="tablist">
    <button type="button" id="tab-order" class="tab active" role="tab" aria-selected="true" aria-controls="panel-order">
      ☕ 주문하기
    </button>
    <button type="button" id="tab-history" class="tab" role="tab" aria-selected="false" aria-controls="panel-history">
      📋 주문 내역
      <!-- 주문 건수 배지 (주문이 없으면 숨김) -->
      <span id="order-count-badge" class="badge hidden">0</span>
    </button>
  </nav>

  <main>
    <!-- ===== [탭 1] 주문하기: 주문서 + 주문 확인 메시지 ===== -->
    <section id="panel-order" class="tab-panel" role="tabpanel" aria-labelledby="tab-order">

      <!-- novalidate: 이름 필수 검사는 JavaScript에서 처리 -->
      <form id="order-form" class="order-form" novalidate>

        <!-- 1. 이름 (필수) -->
        <div class="form-group">
          <label for="customer-name">이름 <span class="required">*</span></label>
          <input type="text" id="customer-name" name="customerName" placeholder="이름을 입력하세요" required>
          <!-- 이름 오류 메시지가 표시될 자리 -->
          <p id="name-error" class="error-message"></p>
        </div>

        <!-- 2. 전화번호 -->
        <div class="form-group">
          <label for="customer-phone">전화번호</label>
          <input type="tel" id="customer-phone" name="customerPhone" placeholder="010-1234-5678">
        </div>

        <!-- 3. 음료 선택 (드롭다운, data-price에 기본 가격 저장) -->
        <div class="form-group">
          <label for="drink">음료 선택</label>
          <select id="drink" name="drink">
            <option value="" data-price="0">-- 음료를 선택하세요 --</option>
            <option value="아메리카노" data-price="3500">아메리카노 3,500원</option>
            <option value="카페라떼" data-price="4000">카페라떼 4,000원</option>
            <option value="카페모카" data-price="4500">카페모카 4,500원</option>
            <option value="바닐라라떼" data-price="4500">바닐라라떼 4,500원</option>
            <option value="녹차라떼" data-price="4500">녹차라떼 4,500원</option>
          </select>
        </div>

        <!-- 4. 사이즈 (라디오, data-price에 추가 금액 저장 / M 기본 선택) -->
        <fieldset class="form-group">
          <legend>사이즈</legend>
          <input type="radio" id="size-s" name="size" value="S" data-price="0">
          <label for="size-s">S (+0원)</label>

          <input type="radio" id="size-m" name="size" value="M" data-price="500" checked>
          <label for="size-m">M (+500원)</label>

          <input type="radio" id="size-l" name="size" value="L" data-price="1000">
          <label for="size-l">L (+1,000원)</label>
        </fieldset>

        <!-- 5. 추가 옵션 (체크박스, data-price에 추가 금액 저장) -->
        <fieldset class="form-group">
          <legend>추가 옵션</legend>
          <input type="checkbox" id="option-shot" name="options" value="샷 추가" data-price="500">
          <label for="option-shot">샷 추가 (+500원)</label>

          <input type="checkbox" id="option-cream" name="options" value="크림 추가" data-price="500">
          <label for="option-cream">크림 추가 (+500원)</label>

          <input type="checkbox" id="option-syrup" name="options" value="시럽 추가" data-price="300">
          <label for="option-syrup">시럽 추가 (+300원)</label>

          <input type="checkbox" id="option-decaf" name="options" value="디카페인" data-price="0">
          <label for="option-decaf">디카페인 (+0원)</label>
        </fieldset>

        <!-- 6. 수량 (최소 1, 최대 10, 기본값 1) -->
        <div class="form-group">
          <label for="quantity">수량</label>
          <input type="number" id="quantity" name="quantity" min="1" max="10" value="1">
        </div>

        <!-- 7. 요청사항 -->
        <div class="form-group">
          <label for="request">요청사항</label>
          <textarea id="request" name="request" rows="4" placeholder="요청사항을 입력하세요"></textarea>
        </div>

        <!-- 8. 예상 금액 표시 영역 (JavaScript가 금액을 갱신) -->
        <p class="total-price">
          예상 금액: <span id="total-price">0</span>원
        </p>

        <!-- 9~10. 버튼 영역 -->
        <div class="button-group">
          <!-- 9. 주문하기 버튼 -->
          <button type="submit" id="order-button">주문하기</button>
          <!-- 10. 다시 작성 버튼 (주문서만 초기화, 주문 내역은 유지) -->
          <button type="reset" id="reset-button">다시 작성</button>
        </div>
      </form>

      <!-- 11. 주문 확인 메시지 영역 (처음에는 hidden 클래스로 숨김) -->
      <section id="order-result" class="order-result hidden"></section>
    </section>

    <!-- ===== [탭 2] 주문 내역 (처음에는 hidden 클래스로 숨김) ===== -->
    <section id="panel-history" class="tab-panel history-panel hidden" role="tabpanel" aria-labelledby="tab-history">

      <!-- 주문이 하나도 없을 때 보이는 안내 문구 -->
      <p id="empty-message" class="empty-message">아직 주문 내역이 없어요 ☕</p>

      <!-- 주문 카드들이 들어갈 목록 (JavaScript의 renderOrders()가 채움) -->
      <ul id="order-list" class="order-list"></ul>

      <!-- 목록 아래 요약: 총 주문 금액 + 모두 지우기 버튼 (주문이 없으면 숨김) -->
      <div id="history-summary" class="history-summary hidden">
        <p class="history-total">
          총 주문 금액: <span id="history-total-price">0</span>원
          (<span id="history-total-count">0</span>건)
        </p>
        <button type="button" id="clear-orders-button" class="clear-button">내역 모두 지우기</button>
      </div>
    </section>
  </main>

  <!-- Supabase 라이브러리(supabase-js v2) 연결: script.js보다 먼저 불러와야 함 -->
  <!-- 불러오면 window.supabase 라는 이름으로 사용할 수 있음 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 스크립트 연결 (HTML을 모두 읽은 뒤 실행되도록 defer 사용) -->
  <script src="script.js" defer></script>
</body>
</html>
